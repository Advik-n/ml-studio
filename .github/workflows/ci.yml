name: CI - Test & Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: cd backend && pip install -r requirements.txt
      - name: Import test
        run: cd backend && python -c "from main import app; from services import eda_service, ml_service, image_service; print('All imports OK')"
      - name: API health test
        run: |
          cd backend
          uvicorn main:app --host 0.0.0.0 --port 8765 &
          # Wait up to 15s for server to be ready
          for i in $(seq 1 15); do
            sleep 1
            curl -sf http://localhost:8765/health && echo "Health check passed" && break
            if [ "$i" = "15" ]; then echo "Server did not start in time" && exit 1; fi
          done
          kill %1 || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
