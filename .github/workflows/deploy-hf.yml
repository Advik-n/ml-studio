name: Deploy Backend to HuggingFace Spaces

on:
  push:
    branches: [main]
    paths: [backend/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Deploy to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          from huggingface_hub import HfApi
          import os

          token = os.environ['HF_TOKEN']
          api = HfApi(token=token)
          user = api.whoami()
          username = user['name']
          space_id = f'{username}/ml-studio-api'

          # Create space if needed
          try:
              api.repo_info(repo_id=space_id, repo_type='space')
          except:
              api.create_repo(repo_id=space_id, repo_type='space', space_sdk='docker', private=False)

          # Write README with HF metadata
          with open('backend/README.md', 'w') as f:
              f.write('---\ntitle: ML Studio API\nemoji: 🧠\ncolorFrom: blue\ncolorTo: purple\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n# ML Studio API\n')

          api.upload_folder(
              folder_path='backend',
              repo_id=space_id,
              repo_type='space',
              ignore_patterns=['__pycache__/**','venv/**','*.pyc','*.db','uploads/**','.env','.git/**','.github/**'],
          )
          print(f'✅ Deployed to https://{username}-ml-studio-api.hf.space')
          "

