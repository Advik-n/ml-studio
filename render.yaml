services:
  - type: web
    name: ml-studio-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    rootDir: backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./ml_studio.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CORS_ORIGINS
        value: https://ml-studio-zeta.vercel.app,http://localhost:3000
      - key: FRONTEND_URL
        value: https://ml-studio-zeta.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
