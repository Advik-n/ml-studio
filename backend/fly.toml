app = "ml-studio-api-backup"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  UPLOAD_DIR = "./uploads"
  MAX_UPLOAD_SIZE_MB = "500"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
