services:
  - type: web
    name: ml-studio-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./ml_studio.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BASE_URL
        fromService:
          type: web
          name: ml-studio-api
          property: host
      - key: FRONTEND_URL
        sync: false
